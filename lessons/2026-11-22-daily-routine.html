  <script type="module">
import {lessonAudio, startLessonGame} from "./lesson-studio-play.js?v=1";

const play = JSON.parse(document.querySelector("#lesson-play-data").textContent);
const lesson = JSON.parse(document.querySelector("#lesson-data").textContent);
const page = document.querySelector("#lesson-material");
const esc = value => String(value ?? "").replace(/[&<>"']/g, char =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));

function phrase([chinese, pinyin, russian]) {
  return `<div class="material-phrase"><span lang="zh">${esc(chinese)}</span>
    ${pinyin ? `<span class="material-pinyin">${esc(pinyin)}</span>` : ""}
    ${russian ? `<span class="caption">${esc(russian)}</span>` : ""}</div>`;
}

function block(id, title, content) {
  return `<section class="panel material-block" id="${id}" aria-labelledby="${id}-title">
    <h2 id="${id}-title">${title}</h2>${content}</section>`;
}

function list(values) {
  return `<ul>${values.map(value => `<li>${esc(value)}</li>`).join("")}</ul>`;
}

function warmup() {
  if (!lesson.warmup) return "";
  return block("warmup", "Разминка на время", `<p>Скажи время по-китайски, потом открой карточку и проверь себя.</p>
    <div class="material-roles">${lesson.warmup.map(([title, ...line]) => `<details><summary>${esc(title)}</summary>${phrase(line)}</details>`).join("")}</div>`);
}

function quiz() {
  const questions = lesson.quiz.map(({ question, options }, index) =>
    `<fieldset><legend>${esc(question)}</legend><div class="material-options">
      ${options.map(([answer, pinyin], n) => `<label><input type="radio" name="q${index}" value="${n}">
        <span>${esc(answer)}${pinyin ? `<span class="material-pinyin">${esc(pinyin)}</span>` : ""}</span></label>`).join("")}
      </div><p class="material-feedback" hidden></p></fieldset>`).join("");
  return `<form id="material-quiz">${questions}<div class="actions">
    <button class="button primary" type="submit">Проверить ответы</button>
    <button class="button" type="reset">Начать заново</button>
    </div><p class="material-result" role="status"></p></form>`;
}

document.title = `${lesson.title} · Китайский по плану`;
page.className = `material-page material-${lesson.theme}`;
page.innerHTML = `<header class="material-top">
  <a class="button quiet" href="${esc(lesson.back)}">К урокам</a>
  <div class="actions">
  ${lesson.pinyin ? '<button type="button" aria-pressed="true" class="button" id="material-pinyin">Пиньинь в карточках</button>' : ""}
  </div></header>
  <section class="material-intro">
    <div><p class="caption">${esc(lesson.name)} · 60 минут</p><h1>${esc(lesson.title)}</h1><p>${esc(lesson.intro)}</p></div>
    <span lang="zh" class="material-character" aria-hidden="true">${{ field: "球", station: "站", routine: "日" }[lesson.theme]}</span>
  </section>
  <nav aria-label="Разделы урока" class="material-nav"><a href="#lesson-play">Игра</a>${lesson.warmup ? '<a href="#warmup">Разминка</a>' : ""}<a href="#phrases">Слова и фразы</a><a href="#dialogue">Диалог</a>
    <a href="#practice">Практика</a><a href="#listening">На слух</a><a href="#speaking">По ролям</a><a href="#homework">Домашнее</a></nav>
  <section class="lesson-play" id="lesson-play" aria-labelledby="lesson-play-title"></section>
  ${warmup()}
  ${block("phrases", "Слова и фразы", `<div class="material-words">${lesson.words.map(phrase).join("")}</div>
    <div class="material-patterns">${lesson.patterns.map(phrase).join("")}</div>`)}
  ${block("dialogue", "Диалог", `<div class="material-dialogue">${lesson.dialogue.map(([speaker, ...line]) =>
    `<div><strong>${esc(speaker)}</strong>${phrase(line)}</div>`).join("")}</div>`)}
  ${block("practice", "Выбери подходящую фразу", quiz())}
  ${block("listening", "Послушай и ответь", `<p>Послушай реплику дважды и ответь на вопросы.</p>
    <div class="material-listen-actions" id="lesson-listen"></div>
    ${list(lesson.listening)}
    <details class="material-transcript"><summary>Текст для чтения</summary>${phrase(lesson.listenText)}</details>`)}
  ${block("speaking", "Сыграйте по ролям", `<p>${esc(lesson.roleplay.intro)}</p>
    <div class="material-roles">${lesson.roleplay.cards.map(card => `<details><summary>${esc(card.title)}</summary>${list(card.facts)}</details>`).join("")}</div>
    <p>${esc(lesson.roleplay.challenge)}</p>`)}
  ${block("homework", "Домашнее задание", `<p>${esc(lesson.homework)}</p>`)}`;

const quizForm = document.querySelector("#material-quiz");
const status = quizForm.querySelector(".material-result");
quizForm.addEventListener("submit", event => {
  event.preventDefault();
  const values = new FormData(quizForm);
  let right = 0;
  let answered = 0;
  quizForm.querySelectorAll("fieldset").forEach((question, index) => {
    const choice = values.get(`q${index}`);
    const note = question.querySelector(".material-feedback");
    const { answer, reason } = lesson.quiz[index];
    note.hidden = false;
    if (choice === null) {
      note.textContent = "Выбери один вариант.";
      note.dataset.result = "empty";
      return;
    }
    const correct = Number(choice) === answer;
    answered++;
    if (correct) right++;
    note.textContent = correct ? `Верно. ${reason}` : "Попробуй ещё раз.";
    note.dataset.result = correct ? "correct" : "retry";
  });
  status.textContent = `Верно ${right} из ${lesson.quiz.length}.${answered < lesson.quiz.length ? " Ответь на пропущенные вопросы." : ""}`;
});
quizForm.addEventListener("reset", () => {
  for (const note of quizForm.querySelectorAll(".material-feedback")) note.hidden = true;
  status.textContent = "";
});

const pinyin = document.querySelector("#material-pinyin");
pinyin?.addEventListener("click", () => {
  const hidden = page.classList.toggle("material-no-pinyin");
  pinyin.setAttribute("aria-pressed", String(!hidden));
});
const listeningSlot = document.querySelector("#lesson-listen");
const player = lessonAudio(play, play.listeningFile, "Озвучка для аудирования");
listeningSlot.append(player);
player.addEventListener("error", () => {
  const status = document.createElement("p");
  status.className = "caption";
  status.setAttribute("role", "status");
  status.textContent = "Аудио не загрузилось. Текст доступен ниже.";
  listeningSlot.append(status);
  document.querySelector("#listening details").open = true;
}, {once: true});

startLessonGame(document.querySelector("#lesson-play"), play);
</script>
</body>
</html>
